[project]
name = "ai4l-content-engine"
version = "0.1.0"
description = "AI4L CRM content engine: generation, image ingest, OAuth exchange and social publishers (worker protocol v1)"
requires-python = ">=3.12"
# Lower bounds are the versions this service was built and tested with on Python 3.14.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "pillow>=12,<13",
    "beautifulsoup4>=4.12,<5",
    "openai>=2.0,<3",
    "google-genai>=1.20,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    # Writes the EXIF (incl. GPS) that the ingest test asserts is stripped. Test-only.
    "piexif>=1.1.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
content-engine-worker = "app.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP047: explicit TypeVars kept for readability of the ported helpers.
ignore = ["B008", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

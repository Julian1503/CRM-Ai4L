<!DOCTYPE html>
<!--
  Rapid Ai4 Learning — "Classic campaign" EmailOctopus template (contract legacy-v1, the "Testing" template).

  Paste into the automation's email step (Started via API trigger, list "New Start").
  The CRM fills every merge tag per recipient at send time; do not type values for them.

    {{Preheader}}     Inbox preview text (also set it as the email's preview text)  120
    {{Headline}}      Main line (also use it as the subject)                          80
    {{Intro}}         Opening paragraph                                              320
    {{Benefit1}}      First concrete outcome                                         110
    {{Benefit2}}      Second outcome                                                 110
    {{Benefit3}}      Third outcome                                                  110
    {{CtaLabel}}      Button text, two to four words                                  28
    {{BookingUrl}}    The recipient's personal booking link (set by the CRM per send)  —
    {{PrefsUrl}}      The recipient's unsubscribe / preferences page (set by the CRM)   —

  Brand: logo cyan #29ABE2 and orange #F0A030 (from the logo) for accents; buttons and
  links use the deeper cyan #0A79A6 so white text on them stays readable (WCAG AA).

  Built for email clients: tables, inline styles, 600px column, bulletproof button for
  Outlook, and a single-column layout that stacks naturally on phones.
-->
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{Headline}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <![endif]-->
  <style>
    @media only screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 24px !important; padding-right: 24px !important; }
      .h1 { font-size: 26px !important; line-height: 32px !important; }
    }
    a { text-decoration: underline; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#EEF8FC;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">

  <!-- Preheader: shown beside the subject in the inbox, hidden in the email. -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;font-size:1px;line-height:1px;color:#EEF8FC;">
    {{Preheader}}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#EEF8FC;">
    <tr>
      <td align="center" style="padding:32px 12px;">

        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">

          <tr>
            <td style="background-color:#FFFFFF;border-radius:12px;overflow:hidden;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                <!-- Accent stripe -->
                <tr>
                  <td style="height:6px;line-height:6px;font-size:0;background-color:#29ABE2;">&nbsp;</td>
                </tr>

                <!-- Logo (square image with white margins; shown wide enough to read) -->
                <tr>
                  <td align="center" style="padding:0 24px;">
                    <img src="https://cgsktvyfzburacvzwneu.supabase.co/storage/v1/object/public/content-public/brand/rapid-ai4-learning-logo.jpg" alt="Rapid Ai4 Learning — human centred training" width="220" height="220"
                         style="display:block;width:220px;height:auto;max-width:220px;border:0;outline:none;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#29ABE2;">
                  </td>
                </tr>

                <!-- Headline + intro -->
                <tr>
                  <td class="px" style="padding:36px 48px 8px;">
                    <h1 class="h1" style="margin:0 0 16px;font-family:'Quicksand',Arial,Helvetica,sans-serif;font-size:30px;line-height:36px;font-weight:700;color:#16303D;letter-spacing:-0.3px;">
                      {{Headline}}
                    </h1>
                    <p style="margin:0 0 20px;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:28px;color:#3B5462;">
                      {{Intro}}
                    </p>
                  </td>
                </tr>

                <!-- Three benefits -->
                <tr>
                  <td class="px" style="padding:0 48px 16px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="32" valign="top" style="padding:2px 0 14px;">
                          <div style="width:22px;height:22px;border-radius:11px;background-color:#E5F6FC;color:#0A79A6;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:22px;font-weight:bold;text-align:center;">&#10003;</div>
                        </td>
                        <td valign="top" style="padding:0 0 14px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:26px;color:#1F2933;">{{Benefit1}}</td>
                      </tr>
                      <tr>
                        <td width="32" valign="top" style="padding:2px 0 14px;">
                          <div style="width:22px;height:22px;border-radius:11px;background-color:#E5F6FC;color:#0A79A6;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:22px;font-weight:bold;text-align:center;">&#10003;</div>
                        </td>
                        <td valign="top" style="padding:0 0 14px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:26px;color:#1F2933;">{{Benefit2}}</td>
                      </tr>
                      <tr>
                        <td width="32" valign="top" style="padding:2px 0 14px;">
                          <div style="width:22px;height:22px;border-radius:11px;background-color:#E5F6FC;color:#0A79A6;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:22px;font-weight:bold;text-align:center;">&#10003;</div>
                        </td>
                        <td valign="top" style="padding:0 0 14px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:26px;color:#1F2933;">{{Benefit3}}</td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Button (VML fallback for Outlook on Windows) -->
                <tr>
                  <td class="px" align="left" style="padding:0 48px 40px;">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="{{BookingUrl}}" style="height:48px;v-text-anchor:middle;width:240px;" arcsize="50%" stroke="f" fillcolor="#0A79A6">
                      <w:anchorlock/>
                      <center style="color:#FFFFFF;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;">{{CtaLabel}}</center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-->
                    <a href="{{BookingUrl}}"
                       style="display:inline-block;padding:14px 28px;background-color:#0A79A6;border-radius:24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:20px;font-weight:bold;color:#FFFFFF;text-decoration:none;">
                      {{CtaLabel}} &rarr;
                    </a>
                    <!--<![endif]-->
                  </td>
                </tr>

              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="px" style="padding:24px 24px 8px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#5B6E80;text-align:center;">
              You are receiving this email from Rapid Ai4 Learning because you subscribed to our updates.
            </td>
          </tr>
          <tr>
            <td class="px" style="padding:0 24px 24px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#5B6E80;text-align:center;">
              <a href="{{PrefsUrl}}" style="color:#0A79A6;text-decoration:underline;">Unsubscribe or choose which emails you receive</a>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
